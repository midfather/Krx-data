name: sec-facts
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/triggers/sec.txt"
permissions:
  contents: write
concurrency:
  group: sec
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 sec/facts.py
        continue-on-error: true
      - name: save
        run: |
          git config user.name "sec-bot"
          git config user.email "sec-bot@users.noreply.github.com"
          git add data/sec
          git commit -m "SEC facts $(TZ=Asia/Seoul date +%F_%H%M)" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 10; done
